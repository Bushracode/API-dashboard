version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dashboard_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metrics_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: dashboard_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/metrics_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: dashboard_frontend
    command: npm run dev
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: